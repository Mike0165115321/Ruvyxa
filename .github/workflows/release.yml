name: Ruvyxa Framework CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_HTTP_TIMEOUT: '120'
  CARGO_NET_RETRY: '10'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
      - name: Validate tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
  verify-release:
    name: Verify release candidate
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ruvyxa-release-verify
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check formatting and dependency locks
        run: |
          pnpm format:check
          pnpm check:cargo-lock
      - name: Lint and test Rust workspace
        run: |
          cargo clippy --workspace --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build, check, and test packages
        run: |
          pnpm -r build
          pnpm -r check
          pnpm -r test
      - name: Validate release metadata and package tarballs
        run: |
          pnpm release:validate
          pnpm pack:smoke

  publish-native:
    name: Publish Ruvyxa Framework CLI (${{ matrix.os }})
    needs: [resolve-version, verify-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: '@ruvyxa/cli-win32-x64'
          - os: windows-11-arm
            package: '@ruvyxa/cli-win32-arm64'
          - os: ubuntu-24.04
            package: '@ruvyxa/cli-linux-x64'
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            package: '@ruvyxa/cli-linux-arm64'
            rust_target: aarch64-unknown-linux-musl
          - os: macos-latest
            package: '@ruvyxa/cli-darwin-arm64'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust release target
        if: matrix.rust_target != ''
        run: rustup target add "${{ matrix.rust_target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'ruvyxa-release-${{ matrix.os }}'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prefetch Rust dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "cargo fetch failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          cargo fetch --locked
      - name: Install JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "pnpm install failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          pnpm install --frozen-lockfile --prefer-offline
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Publish ${{ matrix.package }}
        run: node scripts/publish-if-new.mjs ${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUVYXA_RUST_TARGET: ${{ matrix.rust_target }}
          RUVYXA_REQUIRE_STATIC_LINUX: ${{ runner.os == 'Linux' && '1' || '0' }}

  publish-packages:
    name: Publish JavaScript packages
    needs: [resolve-version, verify-release, publish-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "pnpm install failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          pnpm install --frozen-lockfile --prefer-offline
      - name: Build packages
        run: pnpm -r build
        env:
          SKIP_NATIVE_BUILD: '1'
      - name: Validate release metadata
        run: pnpm release:validate
      - name: Publish JavaScript packages in dependency order
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          for PACKAGE in \
            @ruvyxa/core \
            @ruvyxa/react \
            @ruvyxa/auth \
            @ruvyxa/database \
            @ruvyxa/realtime \
            @ruvyxa/adapter-aws \
            @ruvyxa/adapter-bun \
            @ruvyxa/adapter-cloudflare \
            @ruvyxa/adapter-deno \
            @ruvyxa/adapter-firebase \
            @ruvyxa/adapter-netlify \
            @ruvyxa/adapter-node \
            @ruvyxa/adapter-railway \
            @ruvyxa/adapter-render \
            @ruvyxa/adapter-static \
            @ruvyxa/adapter-vercel \
            ruvyxa \
            create-ruvyxa; do
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION already exists; skipping"
            else
              echo "Publishing $PACKAGE@$VERSION"
              pnpm --filter "$PACKAGE" publish --access public --no-git-checks
            fi
            for ATTEMPT in 1 2 3 4 5 6; do
              if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
                echo "$PACKAGE@$VERSION is available on npm"
                break
              fi
              if [ "$ATTEMPT" = 6 ]; then
                echo "::error::${PACKAGE}@${VERSION} is not available on npm after publish"
                exit 1
              fi
              echo "Waiting for ${PACKAGE}@${VERSION} to propagate to npm..."
              sleep 10
            done
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SKIP_NATIVE_BUILD: '1'
      - name: Verify published packages install from npm
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          for PACKAGE in \
            @ruvyxa/core \
            @ruvyxa/react \
            @ruvyxa/auth \
            @ruvyxa/database \
            @ruvyxa/realtime \
            @ruvyxa/adapter-aws \
            @ruvyxa/adapter-bun \
            @ruvyxa/adapter-cloudflare \
            @ruvyxa/adapter-deno \
            @ruvyxa/adapter-firebase \
            @ruvyxa/adapter-netlify \
            @ruvyxa/adapter-node \
            @ruvyxa/adapter-railway \
            @ruvyxa/adapter-render \
            @ruvyxa/adapter-static \
            @ruvyxa/adapter-vercel \
            ruvyxa \
            create-ruvyxa; do
            npm view "$PACKAGE@$VERSION" version
          done
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "ruvyxa@$VERSION"
      - name: Release summary
        run: |
          echo "## Release v${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "All JavaScript packages and every official adapter were published and installed from npm successfully." >> "$GITHUB_STEP_SUMMARY"
