<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ruvyxa Bundle Analyzer</title>
    <style>
      :root { color-scheme: dark; --bg:#111417; --panel:#181d22; --line:#2a323a; --muted:#92a0ad; --text:#eef3f7; --accent:#47b7c8; --warn:#e5ad54; --bad:#ec7777; font-family:Inter,ui-sans-serif,system-ui,sans-serif }
      * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text) }
      header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:20px; padding:16px 24px; border-bottom:1px solid var(--line); background:rgba(17,20,23,.96) }
      h1 { margin:0; font-size:20px; letter-spacing:-.02em } header span { color:var(--muted); font:12px ui-monospace,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
      main { max-width:1320px; margin:auto; padding:24px }
      .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:var(--panel) }
      .metric { padding:18px; border-right:1px solid var(--line) } .metric:last-child { border:0 }
      .metric small { display:block; color:var(--muted); margin-bottom:6px } .metric strong { font-size:24px; font-variant-numeric:tabular-nums }
      .toolbar { display:flex; gap:12px; align-items:center; margin:24px 0 12px }
      input { flex:1; min-width:180px; padding:10px 12px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px }
      input:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
      table { width:100%; border-collapse:collapse; border:1px solid var(--line); background:var(--panel) }
      th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:13px } th { color:var(--muted); font-weight:600 }
      td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap } code { color:#bee9ef }
      .bar-track { width:180px; height:8px; background:#242b31; border-radius:2px; overflow:hidden } .bar { height:100%; background:var(--accent) }
      .empty { padding:36px; text-align:center; color:var(--muted) } .bad { color:var(--bad) }
      @media (max-width:760px) { main{padding:16px}.summary{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.bar-track{width:90px}th:nth-child(4),td:nth-child(4){display:none} }
      @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important } }
    </style>
  </head>
  <body>
    <header><h1>Ruvyxa Bundle Analyzer</h1><span id="root"></span></header>
    <main>
      <section class="summary" aria-label="Bundle summary">
        <div class="metric"><small>Page routes</small><strong id="routes">0</strong></div>
        <div class="metric"><small>Output</small><strong id="output">0 B</strong></div>
        <div class="metric"><small>Estimated gzip</small><strong id="gzip">0 B</strong></div>
        <div class="metric"><small>Diagnostics</small><strong id="diagnostics">0</strong></div>
      </section>
      <div class="toolbar"><input id="filter" type="search" placeholder="Filter routes or modules…" aria-label="Filter routes or modules" /></div>
      <table>
        <thead><tr><th>Route</th><th>Bundle</th><th>Relative size</th><th>Modules</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No routes match this filter.</div>
    </main>
    <script id="analysis" type="application/json">__RUVYXA_ANALYSIS_DATA__</script>
    <script>
      (() => {
        const data=JSON.parse(document.getElementById('analysis').textContent); const manifest=data.bundle.clientManifest||{}; const routes=manifest.routes||[];
        const bytes=n=>{if(!Number.isFinite(n))return '0 B';const u=['B','KB','MB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
        const routeBytes=r=>Number(r.outputBytes??r.bytes??0)+[...(r.chunks||[]),...(r.sharedChunks||[])].reduce((n,c)=>n+Number(c.bytes||0),0);
        const moduleNames=r=>[...new Set([...(r.chunkManifest?.modules||[]),...(r.chunks||[]).flatMap(c=>c.modules||[]),...(r.sharedChunks||[]).flatMap(c=>c.modules||[])])];
        const max=Math.max(1,...routes.map(routeBytes)); document.getElementById('root').textContent=data.root;
        document.getElementById('routes').textContent=String(routes.length); document.getElementById('output').textContent=bytes(Number(manifest.outputBytes||0));
        document.getElementById('gzip').textContent=bytes(Number(manifest.estimatedGzBytes||0)); const diag=document.getElementById('diagnostics'); diag.textContent=String(data.validation.diagnostics.length); if(data.validation.diagnostics.length)diag.classList.add('bad');
        const tbody=document.getElementById('rows'), empty=document.getElementById('empty');
        function render(query=''){tbody.replaceChildren();const needle=query.trim().toLowerCase();const visible=routes.filter(r=>!needle||`${r.path} ${moduleNames(r).join(' ')}`.toLowerCase().includes(needle));
          for(const r of visible){const size=routeBytes(r),mods=moduleNames(r);const tr=document.createElement('tr');
            const path=document.createElement('td'),code=document.createElement('code');code.textContent=r.path;path.append(code);tr.append(path);
            const amount=document.createElement('td');amount.className='num';amount.textContent=bytes(size);tr.append(amount);
            const visual=document.createElement('td'),track=document.createElement('div'),bar=document.createElement('div');track.className='bar-track';bar.className='bar';bar.style.width=`${Math.max(2,size/max*100)}%`;track.append(bar);visual.append(track);tr.append(visual);
            const modules=document.createElement('td');modules.textContent=`${mods.length} module${mods.length===1?'':'s'}`;modules.title=mods.join('\n');tr.append(modules);tbody.append(tr)} empty.hidden=visible.length!==0 }
        document.getElementById('filter').addEventListener('input',e=>render(e.currentTarget.value));render();
      })();
    </script>
  </body>
</html>
